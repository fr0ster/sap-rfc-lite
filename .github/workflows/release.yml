name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi

      # --ignore-scripts: no dependency script is needed to lint, typecheck and test
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails on any known advisory of moderate severity or above, dev
      # dependencies included: they run here and on every developer's machine.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run Biome lint
        run: npm run lint:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  github-release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          # The generated notes append their own "What's Changed" section
          body: |
            ## Installation

            ```bash
            npm install @mcp-abap-adt/sap-rfc-lite
            ```

            Requires SAP NW RFC SDK installed on the machine (`SAPNWRFC_HOME` env var).
