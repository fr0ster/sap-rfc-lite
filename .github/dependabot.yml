version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let new releases age before proposing them (supply-chain protection).
    # Applies to version updates only; security updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Kept at the lowest supported Node.js line (engines: node >= 18).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ts-jest 29 supports only typescript < 7; remove once ts-jest supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
